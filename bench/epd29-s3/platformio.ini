; Bench test only: an ESP32-S3 devkit driving a 2.9" e-paper module.
; Neither board is mCOLD hardware -- this exists to check wiring, pick the
; right panel class and measure a real full-refresh time.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Local echo stays off: the firmware echoes what it accepts instead. Only
; it knows how to rub a character out when you backspace, and with both
; echoing every keystroke came back doubled.
monitor_echo = no
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial over the native USB port
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9
