# mCOLD Foam V.1 -- the station's profile.
#
# Stages run in `sequence` order. A step that fails ends its stage unless
# it is `optional`. Every pattern below is taken from the source that
# prints it: bringup/src/main.cpp for the test firmware, firmware/src/
# main.cpp (firmware/p7-power) for the product firmware.
#
# Why the setup comes after the real firmware, not before: bringup is an
# Arduino build with Arduino's partition table (default_16MB.csv); the
# product has its own (firmware/partitions.csv). Anything set before the
# product's table is laid down -- and the whole chip erased under it --
# would be lost or sit where the product does not look. And the product
# firmware already has every setup command, so there is no separate
# "setup firmware" to write or keep in step.

product: mcold
name: mCOLD Foam V.1 (ESP32-S3-WROOM-1U-N16R8)
chip: esp32s3

# What firmware/tools/usb_first_flash.py writes and was proven with:
# dio/80m in the header; the bootloader switches the flash to QIO itself.
flash: {size: 16MB, mode: dio, freq: 80m}

usb:
  vid: 0x303A
  usj_pid: 0x1001        # USB-Serial-JTAG: blank chip, ROM, bringup, firmware <= 0.6.0
  rom_pids: [0x1001, 0x0009]
  app_pids: [0x4003]     # the product firmware's TinyUSB drive + console (0.7.0-dev.12 on)
  app_serial_unset: "MCOLD-{mac4}"   # its USB serial before `sn set`

console:
  baud: 115200
  eol: "\r\n"
  download_command: flash
  boot_wait_s: 3

sn:
  # logrow.cpp sn_pattern_ok(): product+V+version, L+lot+year, month+year, unit
  pattern: '[A-Za-z]{3}V\d-L\d{4}-(0[1-9]|1[0-2])\d{2}-\d{3}'
  example: mCDV1-L0169-1069-001
  # A lot shares everything but the unit: the station takes the lot once
  # (`mCDV1-L0169-1069`) and each slot only its unit number.
  lot_pattern: '[A-Za-z]{3}V\d-L\d{4}-(0[1-9]|1[0-2])\d{2}'
  lot_example: mCDV1-L0169-1069
  unit_sep: '-'
  unit_digits: 3

# The settings a site may give every box (`config set`), with their ranges
# and defaults from docs/manuals/service-manual.md section 5. The settings
# page offers these by name and checks the range before saving.
config_keys:
  sample_period_s: {min: 60, max: 3600, default: 300, label: "เก็บข้อมูลทุก (วินาที)"}
  upload_period_s: {min: 60, max: 86400, default: 300, label: "ส่งข้อมูลขึ้น server ทุก (วินาที, ใช้แบต)"}
  gnss_period_s: {min: 300, max: 86400, default: 1800, label: "หาตำแหน่ง GNSS ทุก (วินาที, ระหว่าง trip)"}
  tz_offset_min: {min: -720, max: 840, default: 420, label: "เขตเวลาบนจอ (นาที จาก UTC)"}
  temp_adj_c100: {min: -1000, max: 1000, default: 0, label: "ปรับค่าอุณหภูมิ (0.01 °C)"}
  buzzer_enabled: {min: 0, max: 1, default: 1, label: "เสียงเตือน (0 ปิด, 1 เปิด)"}
  led_bright_pct: {min: 1, max: 100, default: 20, label: "ความสว่างไฟข้าง (%)"}
  led_front_pct: {min: 1, max: 100, default: 2, label: "ความสว่างไฟหน้า (%)"}
  led_status_s: {min: 60, max: 3600, default: 900, label: "กะพริบบอกว่ายังทำงานทุก (วินาที)"}
  accel_wake_ths: {min: 1, max: 63, default: 2, label: "ความไวการเคลื่อนไหว (x31 mg)"}
  batt_trip_mv: {min: 3000, max: 4100, default: 3550, label: "แบตต่ำกว่านี้ห้ามเริ่ม trip (mV)"}
  batt_off_mv: {min: 3000, max: 3700, default: 3400, label: "แบตต่ำกว่านี้ปิดเครื่อง (mV)"}
  idle_wake_s: {min: 300, max: 86400, default: 3600, label: "หลับนานสุดเมื่อไม่มีงาน (วินาที)"}
  sleep_en: {min: 0, max: 1, default: 1, label: "Deep sleep ตอนใช้แบต (0/1)"}
  usb_drive: {min: 0, max: 1, default: 1, label: "แสดงเป็นไดรฟ์ USB (0/1)"}

chip_expect:
  flash_size: 16MB

firmware:
  test:
    description: bringup -- one rail, one chip at a time (bringup/README.md)
    project: bringup
    env: mcold
    console: usj
    images:
      - {offset: 0x0,     file: bootloader.bin}
      - {offset: 0x8000,  file: partitions.bin}
      - {offset: 0x10000, file: firmware.bin}
  production:
    description: the product firmware (firmware/)
    project: firmware
    env: mcold
    console: app
    partitions_csv: firmware/partitions.csv
    # `flash` (download mode without a BOOT button), `sn set` and `ota base`
    # first came together in 0.7.0-dev.5 (firmware/p7-power); 0.6.0 has none
    min_version: 0.7.0-dev.5
    images:
      - {offset: 0x0,     file: bootloader.bin}
      - {offset: 0x8000,  file: partitions.bin}
      - {offset: 0xD000,  file: ota_data_initial.bin}
      - {offset: 0x20000, file: firmware.bin}

sequence: [test, production, setup, verify]

# The ways a new box goes through the line. The dock does everything with
# the box on USB; the quick route keeps it on USB only for what needs the
# cable (firmware, SN, Wi-Fi, fixed address, broker) and does the rest on
# the rack, over Wi-Fi -> MQTT, many boxes at once (docs/rack.md).
routes:
  - [test, production, setup, verify]
  - [quick, rack]

# What the station offers to run. A box already made comes back for new
# settings or a new firmware without losing its SN, its settings or its
# trip log: `update` writes the app alone, nothing is erased.
modes:
  - {name: all,           label: "ทำใหม่ทั้งหมด (กล่องใหม่)",       stages: [test, production, setup, verify]}
  - {name: usb_quick,     label: "USB เร็ว → ชั้นวาง MQTT",          stages: [quick]}
  - {name: resetup,       label: "เปลี่ยนตั้งค่า (ไม่ flash)",        stages: [setup, verify]}
  - {name: reflash,       label: "Flash ใหม่ เก็บ SN และค่าเดิม",   stages: [update, verify]}
  - {name: reflash_setup, label: "Flash ใหม่ + ตั้งค่าใหม่",         stages: [update, setup, verify]}

stages:
  # ---- 1. test the modules of an assembled box, with bringup ------------
  # The line works a lot at a time on boxes already built: the power stage
  # was tested before assembly and the sensors are soldered in, so there is
  # no multimeter check, no charger test and no pulling the probe here.
  test:
    - name: ชิปคือ ESP32-S3 flash 16 MB
      type: chip
      help: "esptool คุยไม่ได้: เช็กสาย USB, ห้ามใช้ USB isolator (ทำบอร์ด brownout)"
    - name: ลง firmware ทดสอบ (bringup)
      type: flash
      firmware: test
      erase: true
    - name: MCU บูตและเป็น N16R8 จริง
      type: console
      send: info
      expect: ['flash\s+16 MB', 'psram\s+8 MB']
      retries: 2
      retry_wait: 2
    - name: I2C ตอบครบ 8 address
      type: console
      send: scan
      expect: ['8 of 8 expected']
      forbid: ['NO ANSWER']
      help: "ไม่มีใครตอบเลย: SDA/SCL, pull-up, 3V3_MAIN · MAX17048 (0x36) ต้องมีแบตเสียบ"
    - name: ชิป I2C คุยได้จริง (identity register)
      type: console
      send: id
      expect: ['WHO_AM_I\s+0x44\s+correct', 'MANUF_ID\s+0x5449', 'DIE_ID\s+0x2260\s+correct',
               'PCF8523\s+SECONDS\s+0x[0-9A-F]{2}\s+OS=0']
      forbid: ['no answer', 'EXPECTED 0x']
      help: "PCF8523 OS=1 = คริสตัลไม่เคยเดิน · MAX17048 no answer = ไม่มีแบต"
    - name: เทอร์โมคัปเปิลอ่านค่าได้
      type: console
      send: temp
      expect: ['temperature\s+-?\d+\.\d+ C']
      forbid: ['no data', 'THERMOCOUPLE OPEN']
      help: "OPEN = โพรบหลุดหรือบัดกรีไม่ติด · 0x0000/0xFFFF = MAX6675 ไม่มีไฟหรือสาย MISO ตาย (ราง EPD_TK)"
    - name: GNSS ส่ง NMEA ที่ checksum ถูก (115200)
      type: nmea
      send: gnss {seconds}
      seconds: 15
      min_good: 3
      help: "ไม่มีไบต์เลย: ราง SD/GNSS, MCU RX = GPIO18 · มีไบต์แต่ checksum ผิด = baud ผิด"
    - name: เปิดราง LED
      type: console
      send: rail led on
    - name: LED 4 ดวงต่อถูกลำดับ
      type: confirm
      send: walk
      timeout: 8
      ask: "ไฟเขียวไล่ทีละดวง: ดวงข้างเครื่อง → สินค้า → ทำงานปกติ → เครื่องมีปัญหา?"
    - name: ปิดราง LED
      type: console
      send: rail led off
    - name: Buzzer ดัง
      type: confirm
      send: buzz 200
      ask: "ได้ยินเสียง beep สั้น ๆ?"
      help: "เสียงเบา: R34 1 kΩ → 330 Ω (README)"

  # ---- 2. the real firmware, on a chip erased whole -----------------------
  production:
    - name: ลง firmware จริง (ลบทั้งชิปก่อน)
      type: flash
      firmware: production
      erase: true
      boot_timeout: 60
    - name: เวอร์ชันตรงกับไฟล์ที่อนุมัติ
      type: version
      firmware: production

  # ---- a box already made: a new app, everything else kept ------------------
  update:
    - name: Flash firmware จริงใหม่ (ไม่ลบ SN ค่าตั้ง และ trip log)
      type: flash
      firmware: production
      only: [ota_data_initial.bin, firmware.bin]
      boot_timeout: 60
    - name: เวอร์ชันตรงกับไฟล์ที่เลือก
      type: version
      firmware: production
    - name: SN ยังอยู่
      type: console
      send: sn
      expect: ['[A-Za-z]{3}V\d-L\d{4}-\d{4}-\d{3}']
      forbid: ['not the factory pattern']
      help: "ไม่มี SN: กล่องนี้ยังไม่เคยผ่านขั้นตั้งค่า ใช้โหมด ทำใหม่ทั้งหมด หรือ Flash ใหม่ + ตั้งค่าใหม่"

  # ---- the quick route: only what needs the cable, about 1.5 minutes ------
  # No bringup, no questions: the box leaves the dock on the line's Wi-Fi
  # with its own fixed address (the IP pool, by unit number) and the
  # broker, and the rack takes it from there (`rack:` below).
  quick:
    - name: ชิปคือ ESP32-S3 flash 16 MB
      type: chip
      help: "esptool คุยไม่ได้: เช็กสาย USB, ห้ามใช้ USB isolator (ทำบอร์ด brownout)"
    - name: ลง firmware จริง (ลบทั้งชิปก่อน)
      type: flash
      firmware: production
      erase: true
      boot_timeout: 60
    - name: เวอร์ชันตรงกับไฟล์ที่เลือก
      type: version
      firmware: production
    - name: SN (ล็อต + เลขเครื่องของช่อง)
      type: input_sn
      ask: "สแกน/พิมพ์ SN จากฉลาก"
    - name: ตั้ง SN แล้วรีบูต
      type: set_sn
    - name: Wi-Fi โรงงาน + IP คงที่, broker, OTA, ค่าตั้ง
      type: provision
      factory: true          # the line's Wi-Fi, fixed address = IP pool + unit number
      customer_wifi: false   # the customer's networks go on at the rack's hand-over
      require: [factory, mqtt]
    - name: เปิดโหมดโรงงาน (รับคำสั่งทดสอบผ่าน MQTT)
      type: console
      send: factory on
      expect: ['factory mode on']
      help: "unknown command = firmware นี้ยังไม่มีโหมดโรงงาน/rpc ผ่าน MQTT (docs/firmware-mqtt-rpc.md) ใช้โหมด ทำใหม่ทั้งหมด ไปก่อน"
    - name: อุปกรณ์บนบอร์ดไม่มีตัวเสีย (เร็ว)
      type: health
      states:
        pd: [ok, unknown]
        buzzer: [ok, unknown]
        sd: [ok, unknown, absent]
        gnss: [ok, unknown]       # the rack's test listens to it properly
      temperature: true
      temp_range: [-40, 85]
      retries: 2
      retry_wait: 4
      help: "failed = ไม่เคยทำงาน (ประกอบผิด) · degraded = เคยทำงานแล้วหลุด"

  # ---- 3. this box's settings ---------------------------------------------
  setup:
    - name: SN (ล็อต + เลขเครื่องของช่อง)
      type: input_sn
      ask: "สแกน/พิมพ์ SN จากฉลาก"
    - name: ตั้ง SN แล้วรีบูต
      type: set_sn
    - name: Wi-Fi, broker, OTA และค่าตั้งต้นของ site (site.ini)
      type: provision
      require: []
      replace_wifi: true      # networks no longer in the settings are removed from the box
    - name: สอบเทียบอุณหภูมิ 1 จุด
      type: calibrate
      enabled: false        # not yet tried on a board; turn on once checked
      settle_s: 10
      samples: 5
      interval: 6
      max_offset_c: 5

  # ---- 4. the box as it will ship --------------------------------------
  verify:
    - name: เวอร์ชันตรงกับไฟล์ที่อนุมัติ
      type: version
      firmware: production
    - name: อุปกรณ์บนบอร์ด ok ครบ
      type: health
      # service manual section 6: pd, buzzer and sd stay unknown until used
      states:
        pd: [ok, unknown]
        buzzer: [ok, unknown]
        sd: [ok, unknown, absent]
      temperature: true
      temp_range: [-40, 85]
      retries: 3
      retry_wait: 10
      help: "failed = ไม่เคยทำงาน (ประกอบผิด) · degraded = เคยทำงานแล้วหลุด"
    - name: นาฬิกาใช้ได้ (ntp, gnss หรือ rtc)
      type: health
      default: [ok, unknown, failed, degraded, absent]
      clock_usable: true
      optional: true
    - name: Trip log ทนไฟดับ (logtest 14 ข้อ)
      type: console
      send: logtest
      until: 'all passed|FAILURES above'
      timeout: 180
      expect: ['all passed']
    - name: ไฟทุกดวง
      type: confirm
      send: ledtest
      timeout: 30
      ask: "ไฟทุกดวงติดครบทุกสี?"
    - name: เสียง
      type: confirm
      send: beep 150
      ask: "ได้ยินเสียง beep?"
    - name: ต่อ Wi-Fi และ broker ได้
      type: console
      send: sync
      expect: ['broker\s+\S+, connected']
      retries: 6
      retry_wait: 10
      optional: true

# ---- the rack: Wi-Fi -> MQTT, off the dock -------------------------------
# A box that passed `quick` and is on USB power anywhere in reach of the
# line's Wi-Fi. Run by mflash/remote.py, one thread per box; the questions
# wait in one queue. `rpc` steps need firmware with the MQTT rpc channel
# (docs/firmware-mqtt-rpc.md): a box without it fails them, it is not
# passed untested.
rack:
  - name: กล่องต่อ broker (IP ตรงกับเลขเครื่อง)
    type: online
    timeout: 300
    ip: true                 # net.ip must be the pool's address for its unit
    firmware: production     # fw.ver must be the version flashed at the dock
  - name: อุณหภูมิและไฟเลี้ยงจาก status
    type: status
    expect: {temp.ok: true, power.external: true}
    range: {temp.c: [-40, 85]}
  - name: ทดสอบโมดูล (I2C, อุณหภูมิ, GNSS, trip log)
    type: rpc
    cmd: FACTORY_TEST
    args: {items: [i2c, temp, gnss, logtest], gnss_s: 15}
    timeout: 240
    expect: {ok: true, i2c.ok: true, temp.ok: true, gnss.ok: true, logtest.ok: true}
    help: "i2c = ชิปไม่ตอบ · temp = โพรบ/MAX6675 · gnss = ราง SD/GNSS หรือ baud · logtest = flash"
  - name: ไฟและเสียง (กล่องกะพริบ + beep)
    type: identify_confirm
    seconds: 10
    ask: "กล่องเลข {unit} ({ip}) ไฟกะพริบครบทุกดวงและมีเสียง beep?"
  - name: ดึงข้อมูล debug
    type: debug_pull
    expect: {coredump: false}
  - name: ค่าตั้งของ site (ส่งซ้ำ เผื่อเปลี่ยนหลังเสียบ)
    type: config_doc
    timeout: 120
  - name: OTA เป็น firmware ที่เลือก (ถ้ายังไม่ใช่)
    type: ota
    firmware: production
    timeout: 600
    enabled: false           # the dock already flashed the chosen one
  - name: ส่งมอบ Wi-Fi (ใส่ของลูกค้า แล้วลบ Wi-Fi โรงงาน) -- ข้อสุดท้าย
    type: wifi_handover
    timeout: 120
