; Copy to site.ini (gitignored) and fill in. The `setup` stage writes these
; into every box through its console; passwords are masked in everything
; the station prints and records.
;
; Leave a section out and that part is skipped. A box built with a
; firmware/secrets.ini already has a default broker.

[station]
name = line-1

; Up to five networks, [wifi.1] .. [wifi.5]. No ip = DHCP.
[wifi.1]
ssid = Factory-AP
password =

;[wifi.2]
;ssid = Warehouse
;password =
;ip = 192.168.1.50
;gateway = 192.168.1.1
;subnet = 255.255.255.0
;dns = 8.8.8.8

; `mqtt set HOST PORT USER PASS` -- the console takes no spaces in the login
[mqtt]
host =
port = 1883
username =
password =

; the OTA file server (`ota base URL`)
[ota]
base =

; `config set KEY VALUE` on every box (keys and ranges: service manual section 5)
[config]
;tz_offset_min = 420
