; Copy to site.ini (gitignored) and fill in. The `setup` stage writes these
; into every box through its console; passwords are masked in everything
; the station prints and records.
;
; Leave a section out and that part is skipped. A box built with a
; firmware/secrets.ini already has a default broker.

[station]
name = line-1

; The customer's networks: up to five, [wifi.1] .. [wifi.5]. No ip = DHCP.
; The dock's `setup` puts them on; the quick route (USB-quick + rack) puts
; them on at the rack's hand-over, its last step.
[wifi.1]
ssid = Customer-AP
password =

;[wifi.2]
;ssid = Warehouse
;password =
;ip = 192.168.1.50
;gateway = 192.168.1.1
;subnet = 255.255.255.0
;dns = 8.8.8.8

; `mqtt set HOST PORT USER PASS` -- the console takes no spaces in the login
[mqtt]
host =
port = 1883
username =
password =

; The line's own Wi-Fi, for the quick route: put on at the dock with a fixed
; address per unit number (unit n = ip_base + n), taken off at the rack's
; hand-over. Its SSID may have no spaces. No ip_base = DHCP.
[factory]
ssid =
password =
ip_base =
gateway =
subnet = 255.255.255.0
dns =

; The station's own login to the broker, for the rack (docs/rack.md).
; Left out = the boxes' login above.
;[station_mqtt]
;username =
;password =

; the OTA file server (`ota base URL`)
[ota]
base =

; `config set KEY VALUE` on every box (keys and ranges: service manual section 5)
[config]
;tz_offset_min = 420
