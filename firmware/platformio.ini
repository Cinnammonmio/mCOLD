; mCOLD Foam V.1 -- product firmware.
;
; ESP-IDF with the Arduino core as a component, not Arduino on its own.
; IDF brings the task model, the power management and the partition
; tooling the design needs; the Arduino component is kept because the
; e-paper driver and the generated GFX fonts from the display work are
; built on it, and rewriting a four-colour waveform driver from scratch
; would be a large risk taken for no gain.
;
; Entry point is app_main(), not setup()/loop(): tasks are created
; deliberately, with their own stacks and priorities, so one of them
; failing cannot stall the others.
[env:mcold]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP-IDF refuses a project path containing a space, which is why this
; lives at C:\mCOLD and not beside the rest of the working tree.
;
; Pure IDF, no Arduino component. Arduino was tried first, to keep
; GxEPD2 for the display, and it drags ESP RainMaker and ESP Insights in
; behind it -- a cloud SDK this product has no use for, which failed the
; build looking for a TLS certificate to embed. The display is phase 4
; and blocked on the real four-ink panel anyway, so the dependency buys
; nothing today and costs every build until then.

; ESP32-S3-WROOM-1U-N16R8: 16 MB QIO flash, 8 MB OCTAL PSRAM.
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; Pads and signs firmware.bin for OTA, and leaves mCOLD_<version>.bin
; beside it for the server (tools/sign_app.py; the key is not in git).
extra_scripts =
    pre:tools/secrets_gen.py
    post:tools/sign_app.py

monitor_speed = 115200
monitor_echo = no
; DTR and RTS held low: opening the monitor no longer resets the board
; (HANDOFF section 4), and the board is not left held in reset.
monitor_dtr = 0
monitor_rts = 0
; Enter sends CR+LF; the console takes either.
monitor_eol = CRLF
