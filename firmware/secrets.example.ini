; Copy to secrets.ini (gitignored) and fill in. The [mqtt] section is the
; broker every box starts with (decided 2026-10-05): tools/secrets_gen.py
; turns it into src/secrets_gen.h (gitignored) at build time, and a box
; with no `mqtt set` of its own uses it. Without secrets.ini, boxes start
; with no broker. [wifi] is not read: networks are per box (`wifi add`).
;
; The login is in every image built this way, OTA files included: anyone
; with a .bin can read it. Keep the broker account to these topics.

[mqtt]
host = siamatic.co.th
port = 1883
username =
password =

[wifi]
ssid =
password =
