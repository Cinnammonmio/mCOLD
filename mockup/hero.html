<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(../mcold-spec/fonts/IBMPlexSansThai-Light.ttf);font-weight:300}
@font-face{font-family:Plex;src:url(../mcold-spec/fonts/IBMPlexSansThai-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(../mcold-spec/fonts/IBMPlexSansThai-Medium.ttf);font-weight:500}
@font-face{font-family:Plex;src:url(../mcold-spec/fonts/IBMPlexSansThai-SemiBold.ttf);font-weight:600}
@font-face{font-family:Plex;src:url(../mcold-spec/fonts/IBMPlexSansThai-Bold.ttf);font-weight:700}
:root{--ink:#14293a;--navy:#0b3550;--teal:#0e8391;--teal2:#1aa5b5;--muted:#5f707c;--line:#dfe7ec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Plex,sans-serif;color:var(--ink);position:relative;
  background:radial-gradient(1200px 860px at 46% 50%,#ffffff 0%,#f2f8fa 50%,#e1eef2 100%)}
#gl,#lines{position:absolute;left:0;top:0;width:1920px;height:1080px}
.title{position:absolute;left:96px;top:84px;width:560px}
.kicker{font-size:16px;font-weight:600;letter-spacing:.24em;color:var(--teal);text-transform:uppercase}
h1{font-size:104px;line-height:1;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-top:12px}
h1 span{color:var(--teal)}
.lead{margin-top:18px;font-size:24px;line-height:1.5;color:#33495a}
.chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#12506f;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:7px 15px 7px 11px}
.chip svg{width:18px;height:18px;color:var(--teal)}
.co{position:absolute;font-size:16px;line-height:1.35;color:var(--navy)}
.co b{font-weight:600;display:block;font-size:18px}
.co small{color:var(--muted);font-size:15px;display:block}
.co.l{text-align:right}
.dots{display:inline-flex;gap:6px;margin-right:8px;vertical-align:1px}
.dots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.applabel{position:absolute;text-align:center;width:420px}
.applabel b{display:block;font-size:19px;color:var(--navy);font-weight:600}
.applabel small{font-size:15px;color:var(--muted)}
.tap{position:absolute;font-size:15px;font-weight:600;color:var(--teal);background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;display:flex;gap:7px;align-items:center;box-shadow:0 6px 16px rgba(11,53,80,.08)}
.tap svg{width:18px;height:18px}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="gl"></canvas>
<svg id="lines"></svg>
<div id="callouts"></div>

<div class="title">
  <div class="kicker">Medical Cold-Chain Monitor</div>
  <h1>m<span>COLD</span></h1>
  <p class="lead">อุปกรณ์ติดตามอุณหภูมิกล่องขนส่งยาและเวชภัณฑ์ บันทึกทุก 5 นาที แจ้งเตือนเมื่อออกนอกช่วง ตลอดเส้นทางขนส่ง</p>
  <div class="chips">
    <span class="chip" data-i="temperature">Thermocouple Type K</span>
    <span class="chip" data-i="nfc">แตะ NFC เริ่มทริป</span>
    <span class="chip" data-i="map-pin">GNSS</span>
    <span class="chip" data-i="wifi">Wi-Fi · BLE</span>
    <span class="chip" data-i="door">ฝากล่อง & การกระแทก</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import * as K from './scene.js';
import {PHONE_CSS, tripScreen} from './phone.js';

for (const el of document.querySelectorAll('.chip')) el.insertAdjacentHTML('afterbegin', await (await fetch('../mcold-spec/icons/' + el.dataset.i + '.svg')).text());
document.head.insertAdjacentHTML('beforeend', `<style>${PHONE_CSS}</style>`);
await K.fonts();

const W = 1920, H = 1080;
const R = K.renderer(document.getElementById('gl'), W, H);
const S = new THREE.Scene();
const FLOOR = -92;
K.studio(R, S, {floorY: FLOOR});
const cam = new THREE.PerspectiveCamera(24, W / H, 10, 3000);
const CP = K.qjson('cam', [60, 135, 520, 23, -40, 12]);
cam.position.set(CP[0], CP[1], CP[2]); cam.lookAt(CP[3], CP[4], CP[5]);

const dev = await K.device(S);
dev.rotation.set(-0.16, -0.42, 0); dev.position.set(-8, -6, 0);
dev.updateMatrixWorld(true);
const P = (x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(dev.matrixWorld);

// cable leaves the bottom edge, loops on the floor and ends at the probe
const exit = P(4, -43.2, .5), down = new THREE.Vector3(0, -1, 0).transformDirection(dev.matrixWorld);
const cr = 1.9, fy = FLOOR + cr;
const rel = [[-3, 14, 16], [-10, 1, 34], [-36, 0, 46], [-64, 0, 36], [-70, 0, 14], [-56, 0, 2], [-42, 0, 14], [-48, 0, 34], [-70, 0, 44], [-96, 0, 44]];
const curve = new THREE.CatmullRomCurve3([exit.clone().addScaledVector(down, -2), exit.clone(), exit.clone().addScaledVector(down, 10),
  ...rel.map(([x, y, z]) => new THREE.Vector3(exit.x + x, fy + y, exit.z + z))], false, 'centripetal');
const tc = K.thermocouple(S, curve, {floorY: FLOOR, spin: +(K.Q.get('pr') || 4.71), fromTip: true});
{const g = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.4, 3, 40), K.M.back());
 g.position.copy(P(4, -43.6, .5)); g.quaternion.copy(dev.quaternion); g.castShadow = true; S.add(g);}

R.render(S, cam);

// ---------- overlays ----------
const pj = K.projector(cam, W, H);
const svg = document.getElementById('lines'), box = document.getElementById('callouts');
const A = {
  screen: pj(P(-28, -4, 6.4)), led: pj(P(-11.2, -24, 6.3)), back: pj(P(43.6, -6, -3.2)),
  probe: pj(tc.probe.localToWorld(new THREE.Vector3(0, 3, 2.8))), nfc: pj(P(0, 36, 6.2)),
};
const co = K.qjson('co', {screen: [520, 480], led: [520, 640], back: [1060, 560], probe: [150, 880]});
K.callout(svg, box, A.screen, co.screen[0], co.screen[1], 'l', 'จอ e-Paper 2.13″', 'กรอบเลนส์สีเข้ม · หน้าจอ TRIP ACTIVE<br>อุณหภูมิล่าสุด และ MIN / MAX ของทริป', {w: 340});
K.callout(svg, box, A.led, co.led[0], co.led[1], 'l',
  '<span class="dots"><i style="background:#ff3b3b"></i><i style="background:#22c8f0"></i><i style="background:#ffb020"></i></span>ไฟสถานะ RGB 3 ดวง',
  'ซ้าย สินค้า (แดง = alarm) · กลาง ทริป (ฟ้า)<br>ขวา ตัวเครื่อง (เหลือง = ต้องตรวจ)', {w: 380});
K.callout(svg, box, A.back, co.back[0], co.back[1], 'r', 'เคสหลังสีเทอร์ควอยซ์', 'ตัวเครื่อง 87 × 87 × 12 มม.');
K.callout(svg, box, A.probe, co.probe[0], co.probe[1], 'r', 'Thermocouple Type K', 'หัววัดสแตนเลส สายถักโลหะ');

// phone with the app, tapping the NFC area of the box
const ph = K.qjson('ph', [1330, 170]);
const phone = document.createElement('div'); phone.className = 'phone'; phone.innerHTML = tripScreen();
phone.style.left = ph[0] + 'px'; phone.style.top = ph[1] + 'px'; phone.style.transform = 'perspective(1600px) rotateY(-14deg) rotateZ(2deg)';
document.body.appendChild(phone);
const lab = document.createElement('div'); lab.className = 'applabel';
lab.innerHTML = '<b>แอป mCOLD</b><small>ดูอุณหภูมิสด กราฟทั้งทริป เริ่ม/หยุดทริป และส่งออก CSV</small>';
lab.style.left = (ph[0] - 45) + 'px'; lab.style.top = (ph[1] + 718) + 'px'; document.body.appendChild(lab);
// NFC link: dashed arc from the NFC area on the box to the phone
const [nx, ny] = A.nfc, px = ph[0] + 6, py = ph[1] + 150;
svg.insertAdjacentHTML('beforeend', `<path d="M${nx},${ny} Q${(nx + px) / 2},${Math.min(ny, py) - 120} ${px},${py}" fill="none" stroke="${K.COL.teal2}" stroke-width="2.2" stroke-dasharray="2 8" stroke-linecap="round"/>
  ${[14, 24, 34].map((r, i) => `<path d="M${nx - r * .7},${ny - r * .7} A${r},${r} 0 0 1 ${nx + r * .7},${ny - r * .7}" fill="none" stroke="${K.COL.teal2}" stroke-width="2" stroke-opacity="${.9 - i * .25}"/>`).join('')}
  <circle cx="${nx}" cy="${ny}" r="5.5" fill="#fff" stroke="${K.COL.teal}" stroke-width="2.4"/>`);
const tap = document.createElement('div'); tap.className = 'tap';
tap.innerHTML = (await (await fetch('../mcold-spec/icons/nfc.svg')).text()) + 'แตะ NFC → เชื่อมต่อ BLE';
tap.style.left = ((nx + px) / 2 - 60) + 'px'; tap.style.top = (Math.min(ny, py) - 112) + 'px'; document.body.appendChild(tap);

await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
console.log(JSON.stringify(A));
window.done = 1;
</script></body></html>
